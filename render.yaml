services:
  - type: web
    name: codemind-backend
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -b 0.0.0.0:10000 app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/codemind.db
      - key: DATABASE_URL
        value: sqlite:////data/codemind.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://codemind-studio.netlify.app,http://localhost:5173
      - key: PORT
        value: 10000
    persistentVolume:
      size: 1024
      mountPath: /data
    healthCheckPath: /health
    autoDeploy: false