<!DOCTYPE html>
<html lang="zh-cn">
 <head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>CMS</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="/static/js/dashboard.js"></script>
 </head>
 <body>
	<!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/static/img/logo.jpg" class="logo">
                <img src="/static/img/logo.jpg" alt="Logo">
                <span>CodeMind Studio</span>
            </a>
            <div class="nav-controls">
                <button class="btn btn-theme" id="theme-toggle">
                    <span id="theme-icon">🌞</span>
                </button>
                <div class="user-menu" id="user-menu">
                    <button class="btn btn-login" id="login-btn">登录</button>
                    <div class="user-avatar-container" id="user-avatar-container" style="display: none;">
                        <img src="/static/img/user_icon.png" alt="用户头像" class="user-avatar" id="user-avatar">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container">
        <!-- 功能模块 -->
        <section class="modules">
            <div class="module-card" data-module="practice">
                <h3>代码练习</h3>
                <p>通过实战提升编程能力</p>
            </div>
            <div class="module-card" data-module="ai-question">
                <h3>AI编程题</h3>
                <p>AI生成编程题</p>
            </div>
            <div class="module-card" data-module="ai-review">
                <h3>AI代码审查</h3>
                <p>获取智能代码分析建议</p>
            </div>
            <div class="module-card" data-module="ability-matrix">
                <h3>能力矩阵</h3>
                <p>全方位评估编程能力</p>
            </div>
        </section>
        <!-- 用户菜单下拉框 -->
    <div class="user-dropdown" id="user-dropdown">
        <div>
            <div><a href="/profile" style="text-decoration: none; color: var(--shadow);">个人中心</a></div>
            <div>
                <button class="btn btn-info btn-logout" id="logout-btn">退出登录</button>
            </div>
        </div>
    </div>
    </main>
   </body>
</html>
