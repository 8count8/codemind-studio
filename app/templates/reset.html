<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - CMS</title>
  <!-- 引用 home.css 以保持风格一致 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
  <script src="{{ url_for('static', filename='js/home.js') }}"></script>
  <script src="{{ url_for('static', filename='js/reset.js') }}" defer></script>
</head>

  <body>

  <!-- 导航栏 -->
    <nav class="navbar">
        <a class="logo">
            <img src="/static/img/logo.jpg" alt="Logo" id="logo-img">
            <span>CodeMind Studio</span>
        </a>

        <div class="nav-buttons">
            <button class="btn btn-theme" id="theme-toggle">
                <span id="theme-icon">🌞</span>
                <span id="theme-text">亮色</span>
            </button>
			</div>
    </nav>

  <div id="reset-password-form-container" class="popup show">
    <form id="reset-password-form" action="/reset_password" method="post" class="auth-form">
      <h2>找回密码</h2>
      <label for="email">邮箱：</label>
      <input type="email" id="email" name="email" required autocomplete="email">
      <label for="new-password">新密码：</label>
      <input type="password" id="new-password" name="new-password" required autocomplete="new-password">
      <label for="verification-code">验证码：</label>
      <div class="verification-code-container">
        <input type="text" id="verification-code" name="verification-code" required autocomplete="off">
        <button type="button" id="get-verification-code-btn">获取验证码</button>
      </div>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">  <!-- 添加CSRF令牌以防止跨站请求伪造 -->
      <input type="submit" value="重置密码">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">  <!-- 添加CSRF令牌以防止跨站请求伪造 -->
      <input type="submit" value="发送重置邮件">
      <button type="button" onclick="window.location.href='/login'">返回登录</button>
    </form>
  </div>
</body>
</html>
