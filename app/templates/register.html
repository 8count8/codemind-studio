<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - CMS</title>
  <!-- 引用 home.css 以保持风格一致 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
  <script src="{{ url_for('static', filename='js/home.js') }}"></script>
  <script src="{{ url_for('static', filename='js/register.js') }}" defer></script>
</head>
  <body style="padding-top: 64px;"> <!-- 添加内联样式 -->
  <!-- 导航栏 -->
    <nav class="navbar">
        <a class="logo">
            <img src="/static/img/logo.jpg" alt="Logo" id="logo-img">
            <span>CodeMind Studio</span>
        </a>

        <div class="nav-buttons">
            <button class="btn btn-theme" id="theme-toggle">
                <span id="theme-icon">🌞</span>
                <span id="theme-text">亮色</span>
            </button>
			</div>
    </nav>
  <div id="register-form-popup" class="popup show">
    <form id="register-form" action="/auth/register" method="post" class="auth-form">
      <h2>注册</h2>
      <label for="new-username">用户名：</label>
      <input type="text" id="new-username" name="new-username" required autocomplete="new-username">
      <label for="new-password">密码：</label>
      <input type="password" id="new-password" name="new-password" required autocomplete="new-password">
      <label for="confirm-password">确认密码：</label>
      <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
      <label for="new-email">邮箱：</label>
      <input type="email" id="new-email" name="new-email" required autocomplete="new-email">
      <label for="verification-code">验证码：</label>
      <div class="verification-code-container">
        <input type="text" id="verification-code" name="verification-code" required autocomplete="off">
        <button type="button" id="get-verification-code-btn">获取验证码</button>
      </div>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">  <!-- 添加CSRF令牌以防止跨站请求伪造 -->
      <input type="submit" value="注册">
      <button type="button" onclick="window.location.href='/home'">关闭</button>
      <p>已有账号？<a href="/login">立即登录</a></p>
    </form>
  </div>
</body>
</html>
