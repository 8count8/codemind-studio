<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>能力矩阵 - CMS</title>
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="/static/css/ability_matrix.css">
    <!-- Chart.js (本地部署) -->
    <script src="/static/js/chart.umd.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a class="logo" href="/dashboard">
            <img src="/static/img/logo.jpg" alt="Logo" id="logo-img">
            <span>CodeMind Studio</span>
        </a>
        <div class="nav-buttons">
            <button class="btn btn-secondary" id="back-btn">返回首页</button>
            <button class="btn btn-theme" id="theme-toggle">
                <span id="theme-icon">🌞</span>
                <span id="theme-text">亮色</span>
            </button>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="ability-container">
        <!-- 页面标题 -->
        <div class="page-header">
            <h1>能力矩阵</h1>
            <p class="page-subtitle">基于您的代码提交记录，全方位评估编程能力</p>
        </div>

        <!-- 顶部统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-level">初学者</span>
                    <span class="stat-label">当前等级</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-submissions">0</span>
                    <span class="stat-label">提交次数</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-average">0</span>
                    <span class="stat-label">平均得分</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-updated">-</span>
                    <span class="stat-label">最近评估</span>
                </div>
            </div>
        </div>

        <!-- 主体两列布局 -->
        <div class="main-content">
            <!-- 左侧：雷达图 + 维度得分 -->
            <div class="left-panel">
                <!-- 雷达图 -->
                <div class="card radar-card">
                    <h2 class="card-title">能力雷达图</h2>
                    <div class="radar-wrapper">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>

                <!-- 维度得分详情 -->
                <div class="card dimensions-card">
                    <h2 class="card-title">维度得分</h2>
                    <div class="dimensions-list" id="dimensions-list">
                        <!-- 动态加载 -->
                    </div>
                </div>
            </div>

            <!-- 右侧：薄弱项分析 + 学习推荐 + 提交代码评估 -->
            <div class="right-panel">
                <!-- 薄弱维度分析 -->
                <div class="card weak-card">
                    <h2 class="card-title">薄弱维度分析</h2>
                    <div class="weak-list" id="weak-list">
                        <p class="empty-hint">暂无评估数据，请先提交代码进行评估</p>
                    </div>
                </div>

                <!-- 学习推荐 -->
                <div class="card recommend-card">
                    <h2 class="card-title">学习推荐</h2>
                    <div class="recommend-list" id="recommend-list">
                        <p class="empty-hint">完成评估后将为您生成个性化学习推荐</p>
                    </div>
                </div>

                <!-- 代码评估提交 -->
                <div class="card submit-card">
                    <h2 class="card-title">快速评估</h2>
                    <p class="submit-hint">粘贴您的代码，系统将自动评估各项能力</p>
                    <textarea id="code-input" class="code-textarea" placeholder="在此粘贴您的代码..."></textarea>
                    <button class="btn btn-primary submit-btn" id="submit-btn">提交评估</button>
                </div>
            </div>
        </div>

        <!-- 提交历史 -->
        <div class="card history-card">
            <h2 class="card-title">评估历史</h2>
            <div class="history-table-wrapper">
                <table class="history-table" id="history-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>来源</th>
                            <th>语法基础</th>
                            <th>算法思维</th>
                            <th>项目实践</th>
                            <th>调试能力</th>
                            <th>安全意识</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr>
                            <td colspan="7" class="empty-cell">暂无历史记录</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <p>正在评估中...</p>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <script src="/static/js/ability_matrix.js"></script>
</body>
</html>
