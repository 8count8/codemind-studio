[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

# ====== Python 运行时 ======
[build.environment]
  PYTHON_VERSION = "3.10.0"

# ====== API 路由重定向到 Netlify Function (app.py) ======
# 使用 200 rewrite 状态码，event.path 会保留原始请求路径
# 这些规则必须在 SPA fallback 之前

# Flask API 端点
[[redirects]]
  from = "/api/*"
  to = "/api/app"
  status = 200

# 认证端点（非 /api 前缀）
[[redirects]]
  from = "/login"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/register"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/reset_password"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/get_verification_code"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/get_forgot_password_code"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/process_code"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/health"
  to = "/api/app"
  status = 200

# Flask 静态资源
[[redirects]]
  from = "/static/*"
  to = "/api/app"
  status = 200

# Swagger / API 文档
[[redirects]]
  from = "/apidocs/*"
  to = "/api/app"
  status = 200

[[redirects]]
  from = "/flasgger_static/*"
  to = "/api/app"
  status = 200

# ====== SPA 路由回退（Vue Router history 模式）======
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ====== 安全头 ======
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# ====== 单页应用缓存策略 ======
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ====== Netlify Functions 配置 ======
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
