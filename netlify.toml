[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

# ====== API 路由规则 ======
# 后端 Flask 已集成到 Netlify Functions
# 所有 /api/* 和其他后端路径直接由 Functions 处理

# /api/* 路由（所有 REST API）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app"
  status = 200

# 认证相关路径
[[redirects]]
  from = "/login"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/register"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/reset_password"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/get_verification_code"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/get_forgot_password_code"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/app"
  status = 200

# 代码审查提交接口
[[redirects]]
  from = "/process_code"
  to = "/.netlify/functions/app"
  status = 200

# 健康检查
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/app"
  status = 200

# ====== SPA 路由回退（Vue Router history 模式）======
# 所有未匹配的路径重定向到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ====== 安全头 ======
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# ====== 单页应用缓存策略 ======
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ====== Cookie 域配置 ======
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Credentials = "true"