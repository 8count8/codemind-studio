[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

# ====== API 反向代理规则（按优先级排列）======
# 后端部署到 Render.com: https://codemind-backend.onrender.com

# /api/* 代理（所有 REST API）
[[redirects]]
  from = "/api/*"
  to = "https://codemind-backend.onrender.com/api/:splat"
  status = 200

# 认证相关路径
[[redirects]]
  from = "/login"
  to = "https://codemind-backend.onrender.com/login"
  status = 200

[[redirects]]
  from = "/logout"
  to = "https://codemind-backend.onrender.com/logout"
  status = 200

[[redirects]]
  from = "/register"
  to = "https://codemind-backend.onrender.com/register"
  status = 200

[[redirects]]
  from = "/reset"
  to = "https://codemind-backend.onrender.com/reset"
  status = 200

[[redirects]]
  from = "/reset_password"
  to = "https://codemind-backend.onrender.com/reset_password"
  status = 200

[[redirects]]
  from = "/get_verification_code"
  to = "https://codemind-backend.onrender.com/get_verification_code"
  status = 200

[[redirects]]
  from = "/get_forgot_password_code"
  to = "https://codemind-backend.onrender.com/get_forgot_password_code"
  status = 200

[[redirects]]
  from = "/auth"
  to = "https://codemind-backend.onrender.com/auth"
  status = 200

# 代码审查提交接口
[[redirects]]
  from = "/process_code"
  to = "https://codemind-backend.onrender.com/process_code"
  status = 200

# Flask 静态资源（图片等）
[[redirects]]
  from = "/static/*"
  to = "https://codemind-backend.onrender.com/static/:splat"
  status = 200

# ====== SPA 路由回退（Vue Router history 模式）======
# 所有未匹配的路径重定向到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ====== 安全头 ======
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# ====== 单页应用缓存策略 ======
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ====== Cookie 域配置 ======
# 如果需要跨域携带 Cookie，确保后端设置 SameSite=None; Secure
# 此配置告知 Netlify 添加相关 CORS 头
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Credentials = "true"